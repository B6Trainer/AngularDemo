<h1>Buildings</h1>

<ul>
    @for(building of buildings(); track $index) {
    <li>
        {{ building.name }}
    </li>
    }
</ul>


<select (change)="handleChange($event)">
    <option value="">-- Select a building --</option>
    @for(building of buildings(); track $index) {
    <option [value]="building.name">
        {{ building.name }}
    </option>
    }
</select>
